[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "gold-pattern-trader"
version = "2.0.0"
description = "Automated XAUUSD trading bot using pattern invalidation and divergence detection"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
keywords = ["trading", "forex", "xauusd", "gold", "mt5"]

[project.scripts]
gold-pattern-trader = "main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
